[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markdown-badges-collection"
version = "0.1.0"
description = "Copy-paste Shields.io badges for GitHub README and profile, generated from a single YAML catalog."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pawang-ai" }]
keywords = ["readme-badges", "markdown-badges", "shields-io", "simple-icons"]
dependencies = ["PyYAML>=6.0,<7.0"]

[project.optional-dependencies]
dev = ["ruff>=0.6", "black>=24.0", "pytest>=8.0", "pytest-cov>=5.0", "types-PyYAML"]

[project.scripts]
badgekit = "badgekit.cli:main"

[project.urls]
Homepage = "https://pawang-ai.github.io/markdown-badges-collection/"
Repository = "https://github.com/pawang-ai/markdown-badges-collection"
Issues = "https://github.com/pawang-ai/markdown-badges-collection/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/badgekit"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --cov=badgekit --cov-report=term-missing"
pythonpath = ["src"]
